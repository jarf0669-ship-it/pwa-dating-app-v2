<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dating App PWA</title>
  <link rel="manifest" href="/manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <main class="w-full max-w-md bg-slate-800 rounded-2xl shadow-xl overflow-hidden border border-slate-700">
    
    <!-- PANTALLA DE AUTENTICACIÓN -->
    <section id="auth-section" class="p-6">
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-rose-500">DatingApp</h1>
        <p class="text-sm text-slate-400 mt-1">Encuentra a tu pareja ideal</p>
      </div>

      <!-- Selector de Pestañas -->
      <div class="grid grid-cols-2 gap-2 p-1 bg-slate-900 rounded-xl mb-6">
        <button id="tab-login" type="button" onclick="switchTab('login')" class="py-2.5 text-sm font-bold rounded-lg transition-all bg-rose-500 text-white shadow-md">
          Iniciar Sesión
        </button>
        <button id="tab-register" type="button" onclick="switchTab('register')" class="py-2.5 text-sm font-bold rounded-lg transition-all text-slate-400 hover:text-slate-200">
          Registrarse
        </button>
      </div>

      <!-- Formulario Login -->
      <form id="form-login" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Correo electrónico</label>
          <input type="email" id="login-email" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-rose-500" placeholder="tu@email.com">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Contraseña</label>
          <input type="password" id="login-password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-rose-500" placeholder="••••••••">
        </div>
        <button type="submit" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-semibold py-2.5 rounded-lg transition-colors shadow-lg shadow-rose-500/20">
          Entrar
        </button>
      </form>

      <!-- Formulario Registro -->
      <form id="form-register" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Nombre de usuario</label>
          <input type="text" id="register-name" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-rose-500" placeholder="Tu Nombre">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Correo electrónico</label>
          <input type="email" id="register-email" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-rose-500" placeholder="tu@email.com">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Contraseña</label>
          <input type="password" id="register-password" required minlength="6" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-rose-500" placeholder="Mínimo 6 caracteres">
        </div>
        <button type="submit" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-semibold py-2.5 rounded-lg transition-colors shadow-lg shadow-rose-500/20">
          Crear cuenta
        </button>
      </form>

      <!-- BANNER DE CONFIRMACIÓN VISUAL (ÉXITO O ERROR) -->
      <div id="auth-status" class="mt-4 text-sm font-semibold text-center hidden p-3 rounded-xl transition-all"></div>
    </section>

    <!-- PANTALLA PRINCIPAL DE LA APP -->
    <section id="app-section" class="hidden">
      <header class="p-3 bg-slate-900 border-b border-slate-700 flex justify-between items-center text-xs">
        <span id="user-display" class="text-slate-300 font-medium truncate max-w-[200px]">Cargando...</span>
        <button id="btn-logout" class="text-rose-400 hover:text-rose-300 font-semibold underline">Cerrar sesión</button>
      </header>

      <div id="profile-card" class="p-6 flex flex-col items-center">
        <div class="relative w-36 h-36 mb-4">
          <img id="profile-img" src="https://images.unsplash.com/photo-1535713875002-d1d0cf37ffde?w=400" class="w-full h-full rounded-full object-cover border-4 border-rose-500" alt="Avatar">
          <span class="absolute bottom-1 right-1 w-4 h-4 bg-emerald-500 border-2 border-slate-800 rounded-full"></span>
        </div>
        <h2 id="profile-name" class="text-xl font-bold">Usuario Registrado</h2>
        <p id="profile-bio" class="text-xs text-slate-400 text-center mt-1">¡Bienvenido a DatingApp!</p>

        <div class="flex gap-4 w-full mt-6">
          <button id="btn-pass" class="flex-1 bg-slate-700 hover:bg-slate-600 font-semibold py-2 rounded-xl transition-colors">Pasar</button>
          <button id="btn-chat" class="flex-1 bg-rose-500 hover:bg-rose-600 font-semibold py-2 rounded-xl transition-colors shadow-lg shadow-rose-500/20">Iniciar Chat</button>
        </div>
      </div>

      <div id="chat-card" class="p-4 hidden flex-col h-[480px]">
        <div id="messages-container" class="flex-1 overflow-y-auto space-y-3 pr-1"></div>
        <form id="chat-form" class="mt-3 flex gap-2">
          <input type="text" id="chat-input" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-rose-500" placeholder="Escribe un mensaje..." required>
          <button type="submit" class="bg-rose-500 hover:bg-rose-600 text-white font-semibold px-4 py-2 rounded-lg text-sm transition-colors">Enviar</button>
        </form>
        <button id="btn-back" class="mt-2 text-xs text-slate-400 hover:text-slate-200 text-center">Volver a perfiles</button>
      </div>
    </section>

  </main>

  <script>
    function switchTab(mode) {
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const formLogin = document.getElementById('form-login');
      const formRegister = document.getElementById('form-register');
      const authStatus = document.getElementById('auth-status');

      if (mode === 'register') {
        tabRegister.className = "py-2.5 text-sm font-bold rounded-lg transition-all bg-rose-500 text-white shadow-md";
        tabLogin.className = "py-2.5 text-sm font-bold rounded-lg transition-all text-slate-400 hover:text-slate-200";
        formRegister.classList.remove('hidden');
        formLogin.classList.add('hidden');
      } else {
        tabLogin.className = "py-2.5 text-sm font-bold rounded-lg transition-all bg-rose-500 text-white shadow-md";
        tabRegister.className = "py-2.5 text-sm font-bold rounded-lg transition-all text-slate-400 hover:text-slate-200";
        formLogin.classList.remove('hidden');
        formRegister.classList.add('hidden');
      }
      if (authStatus) authStatus.classList.add('hidden');
    }

    const SUPABASE_URL = 'https://iyazkymfqyaidupqkkg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml5YXpreW1mcXlhaWR1cHFra2tnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4MjAwOTMsImV4cCI6MjEwNTM5NjA5M30.VhSJePG2tmijiNNIh1xD0NfsUmyoFlQHj_n6cKNuU3w'; 

    let supabaseClient = null;

    function initSupabase() {
      if (window.supabase && window.supabase.createClient) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        return true;
      }
      return false;
    }

    window.addEventListener('DOMContentLoaded', () => {
      initSupabase();

      const authSection = document.getElementById('auth-section');
      const appSection = document.getElementById('app-section');
      const formLogin = document.getElementById('form-login');
      const formRegister = document.getElementById('form-register');
      const authStatus = document.getElementById('auth-status');
      const userDisplay = document.getElementById('user-display');
      const btnLogout = document.getElementById('btn-logout');

      const profileCard = document.getElementById('profile-card');
      const chatCard = document.getElementById('chat-card');
      const btnChat = document.getElementById('btn-chat');
      const btnBack = document.getElementById('btn-back');
      const chatForm = document.getElementById('chat-form');
      const chatInput = document.getElementById('chat-input');
      const messagesContainer = document.getElementById('messages-container');

      let currentUser = null;

      function showStatus(message, isError = true) {
        if (!authStatus) return;
        authStatus.textContent = message;
        authStatus.classList.remove('hidden');
        authStatus.className = `mt-4 text-xs font-bold text-center p-3 rounded-xl border ${
          isError 
            ? 'bg-rose-500/20 text-rose-300 border-rose-500/30' 
            : 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30 shadow-lg shadow-emerald-500/10'
        }`;
      }

      // Registro de usuario
      formRegister.onsubmit = async (e) => {
        e.preventDefault();
        const name = document.getElementById('register-name').value;
        const email = document.getElementById('register-email').value;
        const password = document.getElementById('register-password').value;

        showStatus('⏳ Creando cuenta...', false);

        if (!supabaseClient && !initSupabase()) {
          showStatus('❌ Error al conectar con Supabase', true);
          return;
        }

        try {
          const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: { data: { display_name: name } }
          });

          if (error) {
            showStatus('❌ ' + error.message, true);
          } else {
            showStatus('✅ ¡REGISTRO EXITOSO! Redirigiendo...', false);
            setTimeout(() => {
              if (data.user) {
                updateUI(data.user);
              } else {
                switchTab('login');
                showStatus('✅ Cuenta creada. Inicia sesión con tus datos.', false);
              }
            }, 1500);
          }
        } catch (err) {
          showStatus('❌ Error de conexión (Failed to fetch). Verifica tu red o Supabase.', true);
        }
      };

      // Inicio de Sesión
      formLogin.onsubmit = async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;

        showStatus('⏳ Iniciando sesión...', false);

        if (!supabaseClient && !initSupabase()) {
          showStatus('❌ Error al conectar con Supabase', true);
          return;
        }

        try {
          const { data, error } = await supabaseClient.auth.signInWithPassword({
            email,
            password
          });

          if (error) {
            showStatus('❌ Error al entrar: ' + error.message, true);
          } else {
            updateUI(data.user);
          }
        } catch (err) {
          showStatus('❌ Error de conexión (Failed to fetch).', true);
        }
      };

      // Cerrar Sesión
      btnLogout.onclick = async () => {
        if (supabaseClient) await supabaseClient.auth.signOut();
        updateUI(null);
      };

      function updateUI(user) {
        currentUser = user;
        if (user) {
          authSection.classList.add('hidden');
          appSection.classList.remove('hidden');
          userDisplay.textContent = user.email;
        } else {
          authSection.classList.remove('hidden');
          appSection.classList.add('hidden');
          userDisplay.textContent = '';
        }
      }

      if (supabaseClient) {
        supabaseClient.auth.onAuthStateChange((event, session) => {
          if (session) {
            updateUI(session.user);
          } else {
            updateUI(null);
          }
        });
      }

      // Chat
      if (btnChat) {
        btnChat.onclick = () => {
          profileCard.classList.add('hidden');
          chatCard.classList.remove('hidden');
          chatCard.classList.add('flex');
        };
      }

      if (btnBack) {
        btnBack.onclick = () => {
          chatCard.classList.add('hidden');
          chatCard.classList.remove('flex');
          profileCard.classList.remove('hidden');
        };
      }
    });
  </script>
</body>
</html>
