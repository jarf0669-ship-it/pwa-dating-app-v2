<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amora Dating App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-white font-sans antialiased">

  <div id="app" class="max-w-md mx-auto min-h-screen flex flex-col justify-between border-x border-slate-800 relative bg-slate-950">
    
    <!-- HEADER -->
    <header class="p-3 border-b border-slate-800 flex flex-col gap-2 bg-slate-900/80 backdrop-blur-md sticky top-0 z-40">
      <div class="flex justify-between items-center">
        <div class="flex items-center space-x-1 bg-slate-800 p-1 rounded-full border border-slate-700">
          <button id="btn-amora" onclick="setMode('amora')" class="px-3 py-1 rounded-full text-xs font-bold bg-pink-600 text-white">
            ❤️ Amora
          </button>
          <button id="btn-club" onclick="setMode('club')" class="px-3 py-1 rounded-full text-xs font-bold text-gray-400">
            🔒 Amora Club
          </button>
        </div>

        <div class="flex items-center space-x-3">
          <i data-lucide="zap" id="header-zap" class="w-5 h-5 text-pink-500"></i>
          <button onclick="toggleFilters(true)"><i data-lucide="sliders-horizontal" class="w-5 h-5 text-gray-300"></i></button>
        </div>
      </div>

      <div class="flex justify-between items-center bg-slate-900 px-3 py-1 rounded-xl text-xs border border-slate-800">
        <div class="flex items-center space-x-2">
          <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-green-500"></span>
          <span id="status-text" class="text-gray-300">Conectado (Recibiendo mensajes)</span>
        </div>
        <button onclick="togglePresence()" class="text-[10px] bg-slate-800 px-2 py-0.5 rounded text-gray-300">Cambiar</button>
      </div>
    </header>

    <!-- VISTA 1: ENCUENTROS (CARRUSEL SWIPE) -->
    <main id="view-encuentros" class="flex-1 flex flex-col justify-between p-3">
      <div id="card-carrusel" class="relative rounded-3xl overflow-hidden aspect-[3/4] bg-slate-900 border border-slate-800 shadow-2xl">
        <img id="carrusel-img" src="https://picsum.photos/400/600?random=1" class="w-full h-full object-cover">
        
        <div class="absolute bottom-0 inset-x-0 p-4 bg-gradient-to-t from-black via-black/50 to-transparent text-white space-y-1">
          <div class="flex items-center gap-2">
            <h2 id="carrusel-name" class="text-xl font-bold">Camila, 25</h2>
            <span class="w-2 h-2 rounded-full bg-green-500"></span>
          </div>
          <p id="carrusel-bio" class="text-xs text-gray-300">Amante del arte, café y viajes. Buscando conexiones reales ✨</p>
        </div>
      </div>

      <!-- BOTONES DE INTERACCIÓN DEL CARRUSEL -->
      <div class="flex justify-around items-center my-3">
        <button onclick="nextCard()" class="w-12 h-12 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center text-red-500 shadow-lg text-lg font-bold">✕</button>
        <button onclick="sendMessagePrompt()" class="w-12 h-12 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center text-blue-400 shadow-lg"><i data-lucide="message-circle" class="w-5 h-5"></i></button>
        <button onclick="likeCard()" class="w-14 h-14 rounded-full bg-gradient-to-r from-pink-600 to-purple-600 flex items-center justify-center text-white shadow-xl shadow-pink-600/30"><i data-lucide="heart" class="w-7 h-7"></i></button>
      </div>
    </main>

    <!-- VISTA 2: DESCUBRE (MOSAICO) -->
    <main id="view-descubre" class="flex-1 overflow-y-auto p-3 space-y-4 hidden">
      <h2 class="text-sm font-bold">Descubre perfiles</h2>
      <div id="grid-perfiles" class="grid grid-cols-3 gap-2"></div>
    </main>

    <!-- VISTA 3: CHATS -->
    <main id="view-chats" class="flex-1 p-3 space-y-3 hidden">
      <h2 class="text-sm font-bold mb-2">Tus Mensajes y Matches</h2>
      <div id="chat-list" class="space-y-2"></div>
    </main>

    <!-- MODAL DETALLE DEL PERFIL -->
    <div id="modal-profile" class="fixed inset-0 bg-black/90 z-50 hidden overflow-y-auto p-4">
      <div class="max-w-md mx-auto bg-slate-900 rounded-3xl overflow-hidden border border-slate-800">
        <div class="relative h-80">
          <img id="detail-img" src="" class="w-full h-full object-cover">
          <button onclick="closeProfileDetail()" class="absolute top-3 right-3 w-8 h-8 rounded-full bg-black/60 text-white font-bold flex items-center justify-center">✕</button>
        </div>
        <div class="p-4 space-y-3">
          <h2 id="detail-name" class="text-xl font-bold"></h2>
          <p id="detail-bio" class="text-xs text-gray-300"></p>
          <div class="flex gap-2">
            <button onclick="sendMessagePrompt(); closeProfileDetail();" class="flex-1 py-2 bg-pink-600 rounded-xl font-bold text-xs">Enviar Mensaje</button>
            <button onclick="likeCard(); closeProfileDetail();" class="flex-1 py-2 bg-purple-600 rounded-xl font-bold text-xs">Dar Me Gusta</button>
          </div>
        </div>
      </div>
    </div>

    <!-- MODAL FILTROS / CUESTIONARIO -->
    <div id="modal-filters" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex flex-col justify-end">
      <div class="p-5 rounded-t-3xl w-full max-w-md mx-auto bg-slate-900 border-t border-slate-800">
        <div class="flex justify-between items-center mb-3">
          <h3 class="text-sm font-bold">Cuestionario de Preferencias</h3>
          <button onclick="toggleFilters(false)">✕</button>
        </div>
        <p class="text-xs text-gray-400 mb-2">Ajusta el tipo de persona que buscas en Amora.</p>
        <button onclick="toggleFilters(false)" class="w-full py-2 bg-pink-600 rounded-xl font-bold text-xs mt-4">Guardar Filtros</button>
      </div>
    </div>

    <!-- BARRA INFERIOR DE NAVEGACIÓN -->
    <nav class="flex justify-around items-center py-2.5 border-t border-slate-800 bg-slate-900 text-[10px]">
      <button onclick="switchTab('encuentros')" id="nav-encuentros" class="flex flex-col items-center text-pink-500 font-bold">
        <i data-lucide="sparkles" class="w-4 h-4 mb-0.5"></i>
        <span>Encuentros</span>
      </button>
      <button onclick="switchTab('descubre')" id="nav-descubre" class="flex flex-col items-center text-gray-400">
        <i data-lucide="user" class="w-4 h-4 mb-0.5"></i>
        <span>Descubre</span>
      </button>
      <button onclick="switchTab('chats')" id="nav-chats" class="flex flex-col items-center text-gray-400">
        <i data-lucide="message-circle" class="w-4 h-4 mb-0.5"></i>
        <span>Chats</span>
      </button>
    </nav>

  </div>

  <script src="script.js"></script>
</body>
</html>
