<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dating PWA</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

  <main class="w-full max-w-sm">
    <!-- Tarjeta de Perfil -->
    <div id="profile-card" class="bg-slate-800 rounded-2xl p-6 shadow-2xl border border-slate-700 text-center flex flex-col items-center">
      <img id="user-avatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=500" alt="Avatar" class="w-32 h-32 rounded-full object-cover mb-4 border-4 border-rose-500 shadow-md">
      <h2 id="user-name" class="text-2xl font-bold text-white mb-1">Cargando...</h2>
      <p id="user-bio" class="text-slate-400 text-sm mb-6 px-2">Conectando con Supabase...</p>
      
      <div class="flex gap-3 w-full">
        <button onclick="nextProfile()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-semibold py-3 rounded-xl transition">Pasar</button>
        <button onclick="startChat()" class="flex-1 bg-rose-600 hover:bg-rose-500 text-white font-semibold py-3 rounded-xl shadow-lg shadow-rose-600/30 transition">Iniciar Chat</button>
      </div>
    </div>

    <!-- Tarjeta de Chat -->
    <div id="chat-card" class="bg-slate-800 rounded-2xl p-4 shadow-2xl border border-slate-700 flex flex-col h-[500px] hidden">
      <div class="flex items-center gap-3 pb-3 border-b border-slate-700">
        <img id="chat-avatar" src="" class="w-10 h-10 rounded-full object-cover">
        <div>
          <h3 id="chat-name" class="font-bold text-white text-sm">Usuario</h3>
          <span class="text-xs text-emerald-400 flex items-center gap-1">● En línea</span>
        </div>
      </div>

      <div id="chat-messages" class="flex-1 overflow-y-auto my-3 p-2 flex flex-col gap-2">
        <p class="text-xs text-slate-500 text-center">Sin mensajes aún...</p>
      </div>

      <div class="flex gap-2 pt-2 border-t border-slate-700">
        <input type="text" id="message-input" placeholder="Escribe un mensaje..." class="flex-1 bg-slate-900 border border-slate-700 text-white rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-rose-500" onkeypress="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()" class="bg-rose-600 hover:bg-rose-500 text-white px-4 py-2 rounded-xl font-semibold text-sm transition">Enviar</button>
      </div>
      <button onclick="closeChat()" class="text-xs text-slate-400 hover:text-white mt-2 text-center w-full">Volver a perfiles</button>
    </div>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
