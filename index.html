<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dating App PWA</title>
  <link rel="manifest" href="/manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <main class="w-full max-w-md bg-slate-800 rounded-2xl shadow-xl overflow-hidden border border-slate-700">
    
    <!-- PANTALLA DE AUTENTICACIÓN -->
    <section id="auth-section" class="p-6">
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-rose-500">DatingApp</h1>
        <p class="text-sm text-slate-400 mt-1">Encuentra a tu pareja ideal</p>
      </div>

      <!-- Selector de Pestañas (Botones integrados) -->
      <div class="grid grid-cols-2 gap-2 p-1 bg-slate-900 rounded-xl mb-6">
        <button id="tab-login" type="button" class="py-2.5 text-sm font-bold rounded-lg transition-all bg-rose-500 text-white shadow-md">
          Iniciar Sesión
        </button>
        <button id="tab-register" type="button" class="py-2.5 text-sm font-bold rounded-lg transition-all text-slate-400 hover:text-slate-200">
          Registrarse
        </button>
      </div>

      <!-- Formulario Login -->
      <form id="form-login" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Correo electrónico</label>
          <input type="email" id="login-email" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-rose-500" placeholder="tu@email.com">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Contraseña</label>
          <input type="password" id="login-password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-rose-500" placeholder="••••••••">
        </div>
        <button type="submit" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-semibold py-2.5 rounded-lg transition-colors shadow-lg shadow-rose-500/20">
          Entrar
        </button>
      </form>

      <!-- Formulario Registro -->
      <form id="form-register" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Nombre de usuario</label>
          <input type="text" id="register-name" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-rose-500" placeholder="Tu Nombre">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Correo electrónico</label>
          <input type="email" id="register-email" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-rose-500" placeholder="tu@email.com">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Contraseña</label>
          <input type="password" id="register-password" required minlength="6" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-rose-500" placeholder="Mínimo 6 caracteres">
        </div>
        <button type="submit" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-semibold py-2.5 rounded-lg transition-colors shadow-lg shadow-rose-500/20">
          Crear cuenta
        </button>
      </form>

      <!-- Mensaje de Estado -->
      <div id="auth-status" class="mt-4 text-xs text-center hidden p-2 rounded-lg"></div>
    </section>

    <!-- PANTALLA PRINCIPAL DE LA APP -->
    <section id="app-section" class="hidden">
      <header class="p-3 bg-slate-900 border-b border-slate-700 flex justify-between items-center text-xs">
        <span id="user-display" class="text-slate-300 font-medium truncate max-w-[200px]">Cargando...</span>
        <button id="btn-logout" class="text-rose-400 hover:text-rose-300 font-semibold underline">Cerrar sesión</button>
      </header>

      <div id="profile-card" class="p-6 flex flex-col items-center">
        <div class="relative w-36 h-36 mb-4">
          <img id="profile-img" src="https://images.unsplash.com/photo-1535713875002-d1d0cf37ffde?w=400" class="w-full h-full rounded-full object-cover border-4 border-rose-500" alt="Avatar">
          <span class="absolute bottom-1 right-1 w-4 h-4 bg-emerald-500 border-2 border-slate-800 rounded-full"></span>
        </div>
        <h2 id="profile-name" class="text-xl font-bold">Usuario</h2>
        <p id="profile-bio" class="text-xs text-slate-400 text-center mt-1">Sin biografía disponible</p>

        <div class="flex gap-4 w-full mt-6">
          <button id="btn-pass" class="flex-1 bg-slate-700 hover:bg-slate-600 font-semibold py-2 rounded-xl transition-colors">Pasar</button>
          <button id="btn-chat" class="flex-1 bg-rose-500 hover:bg-rose-600 font-semibold py-2 rounded-xl transition-colors shadow-lg shadow-rose-500/20">Iniciar Chat</button>
        </div>
      </div>

      <div id="chat-card" class="p-4 hidden flex-col h-[480px]">
        <div id="messages-container" class="flex-1 overflow-y-auto space-y-3 pr-1"></div>
        <form id="chat-form" class="mt-3 flex gap-2">
          <input type="text" id="chat-input" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-rose-500" placeholder="Escribe un mensaje..." required>
          <button type="submit" class="bg-rose-500 hover:bg-rose-600 text-white font-semibold px-4 py-2 rounded-lg text-sm transition-colors">Enviar</button>
        </form>
        <button id="btn-back" class="mt-2 text-xs text-slate-400 hover:text-slate-200 text-center">Volver a perfiles</button>
      </div>
    </section>

  </main>

  <script>
    const SUPABASE_URL = 'https://stackblitzstartersm4ejeehz-mdto.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'; 

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    window.addEventListener('DOMContentLoaded', () => {
      const authSection = document.getElementById('auth-section');
      const appSection = document.getElementById('app-section');
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const formLogin = document.getElementById('form-login');
      const formRegister = document.getElementById('form-register');
      const authStatus = document.getElementById('auth-status');
      const userDisplay = document.getElementById('user-display');
      const btnLogout = document.getElementById('btn-logout');

      const profileCard = document.getElementById('profile-card');
      const chatCard = document.getElementById('chat-card');
      const btnChat = document.getElementById('btn-chat');
      const btnBack = document.getElementById('btn-back');
      const chatForm = document.getElementById('chat-form');
      const chatInput = document.getElementById('chat-input');
      const messagesContainer = document.getElementById('messages-container');

      let currentUser = null;

      // Cambiar pestañas
      tabLogin.onclick = () => {
        tabLogin.className = "py-2.5 text-sm font-bold rounded-lg transition-all bg-rose-500 text-white shadow-md";
        tabRegister.className = "py-2.5 text-sm font-bold rounded-lg transition-all text-slate-400 hover:text-slate-200";
        formLogin.classList.remove('hidden');
        formRegister.classList.add('hidden');
        authStatus.classList.add('hidden');
      };

      tabRegister.onclick = () => {
        tabRegister.className = "py-2.5 text-sm font-bold rounded-lg transition-all bg-rose-500 text-white shadow-md";
        tabLogin.className = "py-2.5 text-sm font-bold rounded-lg transition-all text-slate-400 hover:text-slate-200";
        formRegister.classList.remove('hidden');
        formLogin.classList.add('hidden');
        authStatus.classList.add('hidden');
      };

      function showStatus(message, isError = true) {
        authStatus.textContent = message;
        authStatus.classList.remove('hidden');
        authStatus.className = `mt-4 text-xs text-center p-2 rounded-lg ${isError ? 'bg-rose-500/20 text-rose-300' : 'bg-emerald-500/20 text-emerald-300'}`;
      }

      // Registro
      formRegister.onsubmit = async (e) => {
        e.preventDefault();
        const name = document.getElementById('register-name').value;
        const email = document.getElementById('register-email').value;
        const password = document.getElementById('register-password').value;

        showStatus('Creando cuenta...', false);

        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: { data: { display_name: name } }
        });

        if (error) {
          showStatus(error.message, true);
        } else {
          showStatus('¡Cuenta creada! Inicia sesión ahora.', false);
        }
      };

      // Login
      formLogin.onsubmit = async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;

        showStatus('Iniciando sesión...', false);

        const { data, error } = await supabase.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          showStatus('Error al entrar: ' + error.message, true);
        } else {
          updateUI(data.user);
        }
      };

      // Logout
      btnLogout.onclick = async () => {
        await supabase.auth.signOut();
        updateUI(null);
      };

      function updateUI(user) {
        currentUser = user;
        if (user) {
          authSection.classList.add('hidden');
          appSection.classList.remove('hidden');
          userDisplay.textContent = user.email;
          loadMessages();
        } else {
          authSection.classList.remove('hidden');
          appSection.classList.add('hidden');
          userDisplay.textContent = '';
        }
      }

      supabase.auth.onAuthStateChange((event, session) => {
        if (session) {
          updateUI(session.user);
        } else {
          updateUI(null);
        }
      });

      // Chat
      if (btnChat) {
        btnChat.onclick = () => {
          profileCard.classList.add('hidden');
          chatCard.classList.remove('hidden');
          chatCard.classList.add('flex');
        };
      }

      if (btnBack) {
        btnBack.onclick = () => {
          chatCard.classList.add('hidden');
          chatCard.classList.remove('flex');
          profileCard.classList.remove('hidden');
        };
      }

      async function loadMessages() {
        const { data, error } = await supabase
          .from('messages')
          .select('*')
          .order('created_at', { ascending: true });

        if (error || !data) return;

        if (messagesContainer) {
          messagesContainer.innerHTML = '';
          data.forEach(msg => appendMessage(msg));
          messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
      }

      function appendMessage(msg) {
        if (!messagesContainer) return;
        const isMe = currentUser && (msg.sender_id === currentUser.id || msg.sender === currentUser.email);
        const time = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        const msgHTML = `
          <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
            <div class="${isMe ? 'bg-rose-500 text-white' : 'bg-slate-700 text-slate-100'} px-3 py-2 rounded-xl max-w-[80%] text-sm">
              ${msg.text || msg.content}
            </div>
            <span class="text-[10px] text-slate-500 mt-0.5 px-1">${time}</span>
          </div>
        `;
        messagesContainer.insertAdjacentHTML('beforeend', msgHTML);
      }

      if (chatForm) {
        chatForm.onsubmit = async (e) => {
          e.preventDefault();
          const text = chatInput.value.trim();
          if (!text || !currentUser) return;

          chatInput.value = '';

          const newMessage = {
            text: text,
            sender: currentUser.email,
            sender_id: currentUser.id
          };

          await supabase.from('messages').insert([newMessage]);
        };
      }

      supabase
        .channel('public:messages')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
          appendMessage(payload.new);
          if (messagesContainer) messagesContainer.scrollTop = messagesContainer.scrollHeight;
        })
        .subscribe();
    });
  </script>
</body>
</html>
