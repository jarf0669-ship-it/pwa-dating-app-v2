<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dating App PWA</title>
  <link rel="manifest" href="/manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <main class="w-full max-w-md bg-slate-800 rounded-2xl shadow-xl overflow-hidden border border-slate-700">
    
    <!-- PANTALLA DE AUTENTICACIÓN -->
    <section id="auth-section" class="p-6">
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-rose-500">DatingApp</h1>
        <p class="text-sm text-slate-400 mt-1">Encuentra a tu pareja ideal</p>
      </div>

      <!-- Pestañas -->
      <div class="grid grid-cols-2 gap-2 p-1 bg-slate-900 rounded-xl mb-6">
        <button id="tab-login" type="button" onclick="switchTab('login')" class="py-2.5 text-sm font-bold rounded-lg transition-all text-slate-400 hover:text-slate-200">
          Iniciar Sesión
        </button>
        <button id="tab-register" type="button" onclick="switchTab('register')" class="py-2.5 text-sm font-bold rounded-lg transition-all bg-rose-500 text-white shadow-md">
          Registrarse
        </button>
      </div>

      <!-- Formulario Login -->
      <form id="form-login" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Correo electrónico</label>
          <input type="email" id="login-email" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-rose-500" placeholder="tu@email.com">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Contraseña</label>
          <input type="password" id="login-password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-rose-500" placeholder="••••••••">
        </div>
        <button type="submit" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-semibold py-2.5 rounded-lg transition-colors">
          Entrar
        </button>
      </form>

      <!-- Formulario Registro -->
      <form id="form-register" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Nombre de usuario</label>
          <input type="text" id="register-name" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-rose-500" placeholder="Tu Nombre">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Correo electrónico</label>
          <input type="email" id="register-email" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-rose-500" placeholder="tu@email.com">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Contraseña</label>
          <input type="password" id="register-password" required minlength="6" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-rose-500" placeholder="Mínimo 6 caracteres">
        </div>
        <button type="submit" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-semibold py-2.5 rounded-lg transition-colors">
          Crear cuenta
        </button>
      </form>

      <!-- Estado -->
      <div id="auth-status" class="mt-4 text-xs font-bold text-center hidden p-3 rounded-xl border"></div>
    </section>

    <!-- PANTALLA PRINCIPAL DE LA APP -->
    <section id="app-section" class="hidden">
      <!-- Encabezado con correo e indicación de estado -->
      <header class="p-3 bg-slate-900 border-b border-slate-700 flex justify-between items-center text-xs">
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span id="user-display" class="text-slate-300 font-medium truncate max-w-[180px]">Cargando...</span>
        </div>
        <button id="btn-logout" class="text-rose-400 hover:text-rose-300 font-semibold underline">Cerrar sesión</button>
      </header>

      <!-- Tarjeta de Perfil -->
      <div id="profile-card" class="p-6 flex flex-col items-center text-center">
        <div class="relative w-32 h-32 mb-4 bg-slate-700 rounded-full flex items-center justify-center border-4 border-rose-500 overflow-hidden shadow-lg">
          <!-- Avatar SVG confiable -->
          <svg class="w-20 h-20 text-slate-400" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
          <span class="absolute bottom-1 right-1 w-4 h-4 bg-emerald-500 border-2 border-slate-800 rounded-full"></span>
        </div>

        <h2 id="profile-title" class="text-xl font-bold">¡Bienvenido!</h2>
        <p class="text-xs text-slate-400 mt-1">Has iniciado sesión correctamente.</p>

        <!-- Botones de Acción -->
        <div class="flex gap-3 w-full mt-6">
          <button id="btn-pass" onclick="nextProfile()" class="flex-1 bg-slate-700 hover:bg-slate-600 font-semibold py-2.5 rounded-xl text-xs transition-colors">
            ❌ Pasar
          </button>
          <button id="btn-chat" onclick="toggleChat(true)" class="flex-1 bg-rose-500 hover:bg-rose-600 font-semibold py-2.5 rounded-xl text-xs transition-colors shadow-lg shadow-rose-500/20">
            💬 Iniciar Chat
          </button>
        </div>
      </div>

      <!-- Panel de Chat -->
      <div id="chat-card" class="p-4 hidden flex-col h-[400px]">
        <div class="flex justify-between items-center pb-2 mb-2 border-b border-slate-700">
          <h3 class="text-xs font-bold text-rose-400">Chat con Match</h3>
          <button onclick="toggleChat(false)" class="text-xs text-slate-400 hover:text-slate-200">✕ Cerrar</button>
        </div>

        <div id="messages-container" class="flex-1 overflow-y-auto space-y-2 pr-1 text-xs">
          <div class="bg-slate-700/60 p-2 rounded-lg max-w-[80%]">
            ¡Hola! ¿Cómo estás?
          </div>
        </div>

        <form id="chat-form" onsubmit="sendMessage(event)" class="mt-3 flex gap-2">
          <input type="text" id="chat-input" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-rose-500" placeholder="Escribe un mensaje..." required>
          <button type="submit" class="bg-rose-500 hover:bg-rose-600 text-white font-semibold px-3 py-2 rounded-lg text-xs transition-colors">
            Enviar
          </button>
        </form>
      </div>
    </section>

  </main>

  <script>
    function switchTab(mode) {
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const formLogin = document.getElementById('form-login');
      const formRegister = document.getElementById('form-register');
      const authStatus = document.getElementById('auth-status');

      if (mode === 'register') {
        tabRegister.className = "py-2.5 text-sm font-bold rounded-lg transition-all bg-rose-500 text-white shadow-md";
        tabLogin.className = "py-2.5 text-sm font-bold rounded-lg transition-all text-slate-400 hover:text-slate-200";
        formRegister.classList.remove('hidden');
        formLogin.classList.add('hidden');
      } else {
        tabLogin.className = "py-2.5 text-sm font-bold rounded-lg transition-all bg-rose-500 text-white shadow-md";
        tabRegister.className = "py-2.5 text-sm font-bold rounded-lg transition-all text-slate-400 hover:text-slate-200";
        formLogin.classList.remove('hidden');
        formRegister.classList.add('hidden');
      }
      if (authStatus) authStatus.classList.add('hidden');
    }

    // URL Y KEY CORREGIDAS CON EXACTITUD
    const SUPABASE_URL = 'https://iyazkymfqyaidupqkkg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml5YXpreW1mcXlhaWR1cHFra2tnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4MjAwOTMsImV4cCI6MjEwNTM5NjA5M30.VhSJePG2tmijiNNIh1xD0NfsUmyoFlQHj_n6cKNuU3w'; 

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    window.addEventListener('DOMContentLoaded', () => {
      const authSection = document.getElementById('auth-section');
      const appSection = document.getElementById('app-section');
      const formLogin = document.getElementById('form-login');
      const formRegister = document.getElementById('form-register');
      const authStatus = document.getElementById('auth-status');
      const userDisplay = document.getElementById('user-display');
      const btnLogout = document.getElementById('btn-logout');

      function showStatus(message, isError = true) {
        authStatus.textContent = message;
        authStatus.classList.remove('hidden');
        authStatus.className = `mt-4 text-xs font-bold text-center p-3 rounded-xl border ${
          isError 
            ? 'bg-rose-500/20 text-rose-300 border-rose-500/30' 
            : 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30'
        }`;
      }

      formRegister.onsubmit = async (e) => {
        e.preventDefault();
        const name = document.getElementById('register-name').value;
        const email = document.getElementById('register-email').value;
        const password = document.getElementById('register-password').value;

        showStatus('⏳ Registrando usuario...', false);

        try {
          const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: { data: { display_name: name } }
          });

          if (error) {
            showStatus('❌ ' + error.message, true);
          } else {
            showStatus('✅ ¡Usuario registrado con éxito!', false);
            setTimeout(() => {
              updateUI(data.user);
            }, 1000);
          }
        } catch (err) {
          showStatus('❌ Error de red.', true);
        }
      };

      formLogin.onsubmit = async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;

        showStatus('⏳ Entrando...', false);

        try {
          const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) {
            showStatus('❌ ' + error.message, true);
          } else {
            updateUI(data.user);
          }
        } catch (err) {
          showStatus('❌ Error de red al iniciar sesión', true);
        }
      };

      btnLogout.onclick = async () => {
        await supabaseClient.auth.signOut();
        updateUI(null);
      };

      function updateUI(user) {
        if (user) {
          authSection.classList.add('hidden');
          appSection.classList.remove('hidden');
          userDisplay.textContent = user.email;
        } else {
          authSection.classList.remove('hidden');
          appSection.classList.add('hidden');
        }
      }

      supabaseClient.auth.onAuthStateChange((event, session) => {
        if (session) updateUI(session.user);
      });
    });

    function toggleChat(open) {
      const profileCard = document.getElementById('profile-card');
      const chatCard = document.getElementById('chat-card');
      if (open) {
        profileCard.classList.add('hidden');
        chatCard.classList.remove('hidden');
        chatCard.classList.add('flex');
      } else {
        chatCard.classList.add('hidden');
        chatCard.classList.remove('flex');
        profileCard.classList.remove('hidden');
      }
    }

    function nextProfile() {
      const titles = ["María, 24", "Sofía, 26", "Carlos, 28", "Laura, 22"];
      const randomTitle = titles[Math.floor(Math.random() * titles.length)];
      document.getElementById('profile-title').textContent = randomTitle;
    }

    function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const container = document.getElementById('messages-container');
      if (!input.value.trim()) return;

      const userMsg = document.createElement('div');
      userMsg.className = 'bg-rose-500/80 text-white p-2 rounded-lg max-w-[80%] ml-auto text-right';
      userMsg.textContent = input.value;
      container.appendChild(userMsg);

      input.value = '';
      container.scrollTop = container.scrollHeight;
    }
  </script>
</body>
</html>
